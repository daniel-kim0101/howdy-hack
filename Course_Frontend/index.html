<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="stylesheet" href="/src/index.css" />
    <!-- figma:head-end -->
  </head>
  <body>
    <main class="index-page">
      <section class="index-card" aria-labelledby="index-title">
        <div class="brand__mark index-logo" aria-label="App logo placeholder">
          <span>LOGO</span>
        </div>
        <p class="eyebrow">Student planning portal</p>
        <h1 id="index-title">Welcome back</h1>
        <p class="signin-intro">Sign in to continue to your degree planner.</p>

        <form class="signin-form">
          <label>
            UIN
            <input type="text" name="uin" inputmode="numeric" autocomplete="username" placeholder="Enter your UIN" />
          </label>
          <button type="button">Sign in</button>
        </form>

        <p class="profile-prompt">
          New user? <a href="/profile.html">Create a profile</a>
        </p>
      </section>
    </main>
  </body>
</html>
